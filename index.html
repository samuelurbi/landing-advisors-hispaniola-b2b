<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Consent Mode v2: todo denied por defecto, ANTES de Google Tag Manager, en el mismo dataLayer
         que los eventos. Si el visitante ya eligió (localStorage «hs-cookies»), se aplica al instante;
         el aviso lo pinta /cookies.js (patrón de la web principal de Karaya). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', { ad_storage: 'denied', analytics_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', wait_for_update: 500 });
      try {
        var c = JSON.parse(localStorage.getItem('hs-cookies') || 'null');
        if (c && typeof c.a === 'boolean' && typeof c.m === 'boolean') {
          gtag('consent', 'update', { analytics_storage: c.a ? 'granted' : 'denied', ad_storage: c.m ? 'granted' : 'denied', ad_user_data: c.m ? 'granted' : 'denied', ad_personalization: c.m ? 'granted' : 'denied' });
        }
      } catch (e) {}
    </script>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MJ8QM339');</script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:inicio — scripts/prerender.mjs reescribe este bloque en el build
         (dominio de SITIO, noindex salvo INDEXAR=1). Esto solo sirve en dev. -->
    <title>Travel Advisor Program · Hispaniola Aquatic Adventures</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- seo:fin -->
    <meta name="theme-color" content="#0b2545" />
    <link rel="icon" type="image/svg+xml" href="/marca/isotipo.svg" />
    <link rel="preload" as="image" href="/fotos/hero-poster.webp" imagesrcset="/fotos/hero-poster-800.webp 800w, /fotos/hero-poster.webp 1600w" imagesizes="100vw" fetchpriority="high" />
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MJ8QM339"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/cookies.js" data-clave="hs-cookies" data-privacidad="/privacy/" defer></script>
  </body>
</html>
